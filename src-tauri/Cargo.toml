[package]
name = "panopin"
version = "1.0.0"
description = "Windows-first clipboard and screenshot shelf, styled as a cork board."
authors = ["Mehmet Burak Taşkaya"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "panopin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.1"
tauri-plugin-single-instance = "2.5.5"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
log = "0.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sys-locale = "0.3"
thiserror = "2"
unicode-normalization = "0.1.26"
url = "2.5.8"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
base64 = "0.23.1"
# Link previews (D-009, D-010): the OS TLS stack, our own resolver and redirect checks.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1.54.1", default-features = false, features = ["net", "rt", "sync", "time"] }
html5gum = "0.8.4"
encoding_rs = "0.8.42"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"

# macOS (D-073): AppKit pasteboard, apps and open panels, Vision text recognition, CoreGraphics key
# events, Accessibility and the screenshot folder setting. Default features would pull in whole
# frameworks, so only the classes in use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2-core-foundation", "objc2-uniform-type-identifiers", "NSApplication", "NSColor", "NSColorSpace", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSWindow", "NSWorkspace"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber", "CFPreferences"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "UI_Shell",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# The `implement` macro (our drag drop source) names this crate directly.
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3.27.0"

# SQLite is C code: built optimised in debug builds too, so search timings in tests are real.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
