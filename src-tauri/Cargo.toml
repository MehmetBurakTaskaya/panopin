[package]
name = "panopin"
version = "0.1.0"
description = "Windows-first clipboard and screenshot shelf, styled as a cork board."
authors = ["Mehmet Burak Taşkaya"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "panopin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.1"
tauri-plugin-single-instance = "2.5.5"
log = "0.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
