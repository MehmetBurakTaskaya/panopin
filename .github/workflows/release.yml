name: Release

# Pushing a tag such as v1.0.0 builds the Windows installer and the portable ZIP and puts them on a
# draft release with latest.json and SHA256SUMS.txt (D-068). The universal macOS .dmg joins them
# once the repository variable PANOPIN_MACOS is "true" (D-073). Publishing the draft is a manual
# step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer and portable ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      signature: ${{ steps.draft.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version, notices and signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag $tag · package.json $npm_version · tauri.conf.json $conf_version · Cargo.toml $cargo_version"
          if [ "$tag" != "$npm_version" ] || [ "$tag" != "$conf_version" ] || [ "$tag" != "$cargo_version" ]; then
            echo "::error::The tag and the three version fields must match"
            exit 1
          fi
          npm run check:third-party
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (docs/SIGNING.md)"
            exit 1
          fi

      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Two downloads with names that never change, so releases/latest/download/<file> links keep
      # working (D-068). The update signature goes into latest.json, not onto the release page.
      - name: Draft release with the installer and the portable ZIP
        id: draft
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/release/bundle/nsis
          mkdir -p out portable
          cp "$bundle/Panopin_${version}_x64-setup.exe" out/Panopin-Setup-x64.exe
          cp src-tauri/target/release/panopin.exe portable/Panopin.exe
          cp LICENSE portable/LICENSE.txt
          cp THIRD_PARTY_NOTICES.txt portable/THIRD_PARTY_NOTICES.txt
          (cd portable && 7z a -tzip -mx=9 ../out/Panopin-Portable-x64.zip . > /dev/null)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber out/Panopin-Setup-x64.exe out/Panopin-Portable-x64.zip
          else
            node scripts/release-notes.mjs "$version" --release > notes.md
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Panopin $version" \
              --notes-file notes.md out/Panopin-Setup-x64.exe out/Panopin-Portable-x64.zip
          fi
          echo "signature=$(tr -d '\r\n' < "$bundle/Panopin_${version}_x64-setup.exe.sig")" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal .dmg
    needs: windows
    # Released only after the Mac build has been tried on a Mac (D-073).
    if: ${{ vars.PANOPIN_MACOS == 'true' }}
    runs-on: macos-latest
    # A failed Mac build leaves the Windows release intact; latest.json then offers Windows only.
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Rust toolchain for both Mac architectures
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Release notes
        id: notes
        run: |
          {
            echo 'body<<PANOPIN_NOTES'
            node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" --release
            echo 'PANOPIN_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Panopin __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target universal-apple-darwin

      - name: Fixed name
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          cp "$dmg" Panopin-macOS.dmg
          gh release upload "$GITHUB_REF_NAME" --clobber Panopin-macOS.dmg

  finish:
    name: latest.json and checksums
    needs: [windows, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_SIGNATURE: ${{ needs.windows.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: latest.json and SHA256SUMS.txt for every file of the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          gh release download "$GITHUB_REF_NAME" --dir out --skip-existing
          rm -f out/latest.json out/SHA256SUMS.txt
          printf '%s' "$WINDOWS_SIGNATURE" > out/Panopin-Setup-x64.exe.sig
          node scripts/release-notes.mjs "$version" > notes.md
          node scripts/latest-json.mjs "$version" notes.md out > out/latest.json
          (cd out && sha256sum $(ls | grep -v -E '^SHA256SUMS\.txt$|\.sig$') > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" --clobber out/latest.json out/SHA256SUMS.txt
