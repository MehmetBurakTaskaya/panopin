name: Release

# Pushing a tag such as v1.0.0 builds the Windows installer and the portable ZIP and puts them on a
# draft release with latest.json and SHA256SUMS.txt (D-068). The universal macOS .dmg and its update
# archive join them while the repository variable PANOPIN_MACOS is "true" (D-073). Publishing the
# draft is a manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer and portable ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PANOPIN_MACOS: ${{ vars.PANOPIN_MACOS }}
    outputs:
      signature: ${{ steps.draft.outputs.signature }}
      portable_signature: ${{ steps.draft.outputs.portable_signature }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version, notices and signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag $tag · package.json $npm_version · tauri.conf.json $conf_version · Cargo.toml $cargo_version"
          if [ "$tag" != "$npm_version" ] || [ "$tag" != "$conf_version" ] || [ "$tag" != "$cargo_version" ]; then
            echo "::error::The tag and the three version fields must match"
            exit 1
          fi
          npm run check:third-party
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (docs/SIGNING.md)"
            exit 1
          fi

      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Two downloads with names that never change, so releases/latest/download/<file> links keep
      # working (D-068). Updates fetch the same installer as Panopin-Update-x64.exe, so the download
      # counts tell people's downloads from updates (D-077); the portable copy updates from its ZIP
      # (D-076), signed here for this version. The update signatures go into latest.json, not onto
      # the release page.
      - name: Draft release with the installer and the portable ZIP
        id: draft
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/release/bundle/nsis
          mkdir -p out portable
          cp "$bundle/Panopin_${version}_x64-setup.exe" out/Panopin-Setup-x64.exe
          cp "$bundle/Panopin_${version}_x64-setup.exe" out/Panopin-Update-x64.exe
          cp src-tauri/target/release/panopin.exe portable/Panopin.exe
          cp LICENSE portable/LICENSE.txt
          cp THIRD_PARTY_NOTICES.txt portable/THIRD_PARTY_NOTICES.txt
          (cd portable && 7z a -tzip -mx=9 ../out/Panopin-Portable-x64.zip . > /dev/null)
          npx tauri signer sign --app-version "$version" out/Panopin-Portable-x64.zip < /dev/null > /dev/null
          files="out/Panopin-Setup-x64.exe out/Panopin-Portable-x64.zip out/Panopin-Update-x64.exe"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber $files
          else
            mac=; [ "$PANOPIN_MACOS" = true ] && mac=--mac
            node scripts/release-notes.mjs "$version" --release $mac > notes.md
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Panopin $version" \
              --notes-file notes.md $files
          fi
          echo "signature=$(tr -d '\r\n' < "$bundle/Panopin_${version}_x64-setup.exe.sig")" >> "$GITHUB_OUTPUT"
          echo "portable_signature=$(tr -d '\r\n' < out/Panopin-Portable-x64.zip.sig)" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal .dmg
    needs: windows
    # Released once the Mac live test passes (D-073).
    if: ${{ vars.PANOPIN_MACOS == 'true' }}
    runs-on: macos-latest
    # A failed Mac build leaves the Windows release intact; latest.json then offers Windows only.
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      signature: ${{ steps.upload.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Rust toolchain for both Mac architectures
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and sign the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      # The .dmg to download and the archive that updates install, under names that never change
      # (D-068). The update signature goes into latest.json, not onto the release page.
      - name: Add the .dmg and the update archive to the draft
        id: upload
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$(ls "$bundle"/dmg/*.dmg | head -n 1)" Panopin-macOS.dmg
          cp "$bundle/macos/Panopin.app.tar.gz" Panopin-macOS.app.tar.gz
          gh release upload "$GITHUB_REF_NAME" --clobber Panopin-macOS.dmg Panopin-macOS.app.tar.gz
          echo "signature=$(tr -d '\r\n' < "$bundle/macos/Panopin.app.tar.gz.sig")" >> "$GITHUB_OUTPUT"

  finish:
    name: latest.json and checksums
    needs: [windows, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_SIGNATURE: ${{ needs.windows.outputs.signature }}
      PORTABLE_SIGNATURE: ${{ needs.windows.outputs.portable_signature }}
      MAC_SIGNATURE: ${{ needs.macos.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: latest.json and SHA256SUMS.txt for every file of the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          gh release download "$GITHUB_REF_NAME" --dir out --skip-existing
          rm -f out/latest.json out/SHA256SUMS.txt
          printf '%s' "$WINDOWS_SIGNATURE" > out/Panopin-Update-x64.exe.sig
          printf '%s' "$PORTABLE_SIGNATURE" > out/Panopin-Portable-x64.zip.sig
          if [ -n "$MAC_SIGNATURE" ] && [ -f out/Panopin-macOS.app.tar.gz ]; then
            printf '%s' "$MAC_SIGNATURE" > out/Panopin-macOS.app.tar.gz.sig
          fi
          node scripts/release-notes.mjs "$version" > notes.md
          node scripts/latest-json.mjs "$version" notes.md out > out/latest.json
          (cd out && sha256sum $(ls | grep -v -E '^SHA256SUMS\.txt$|\.sig$') > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" --clobber out/latest.json out/SHA256SUMS.txt
