name: Mac test build

# Builds the universal macOS .dmg without releasing it, so the Mac version can be tried on a Mac
# before the repository variable PANOPIN_MACOS adds it to releases (D-073). It runs only when
# started by hand (Actions → Mac test build → Run workflow); the .dmg stays under the run's
# artifacts for 14 days.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: macOS universal .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Rust toolchain for both Mac architectures
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # Signed like a release (D-078), so the permissions given to a test build stay with the
      # releases that follow.
      - name: Signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::The MACOS_CERTIFICATE or MACOS_CERTIFICATE_PASSWORD secret is missing (docs/SIGNING.md)"
            exit 1
          fi
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          bash scripts/mac-signing.sh import "$RUNNER_TEMP/signing.p12"
          rm "$RUNNER_TEMP/signing.p12"

      # A test build installs no updates, so it needs no update packages and no update key.
      - name: Build
        run: |
          npm run tauri build -- --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Panopin.app
          codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p'
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "Panopin-${version}-${GITHUB_SHA::7}-macOS-test.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Panopin-*-macOS-test.dmg
          archive: false
          retention-days: 14
          if-no-files-found: error
